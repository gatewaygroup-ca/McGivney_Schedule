<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>McGivney Community Homes — Project Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="authGate" class="auth-gate"><div class="auth-gate-inner">Checking sign-in…</div></div>

<div class="wrap" id="appWrap" style="display:none;">

  <div class="topbar">
    <div>
      <a href="https://gatewaygroup-ca.github.io/43-Munn-Schedule/dashboard.html" class="back-link">← Gateway Dashboard</a>
      <div class="brand-eyebrow">Residential Conversion · 3 Sites</div>
      <div class="brand-title" id="projName">McGivney Community Homes</div>
      <div class="brand-sub">Project schedule &amp; live tracker</div>
    </div>
    <div class="toolbar">
      <button class="btn" id="btnEditModeToggle" style="display:none;">Edit Schedule</button>
      <div class="user-menu">
        <span id="userEmailLabel"></span>
        <span class="role-badge" id="userRoleBadge"></span>
        <button class="btn" id="btnLogout">Log Out</button>
      </div>
    </div>
  </div>

  <div class="view-mode-banner" id="viewModeBanner" style="display:none;"></div>

  <div class="card" style="margin-bottom:14px;">
    <div class="contract-card">
      <div><div class="cc-label">Contract</div><div class="cc-value" id="ccContract"></div></div>
      <div><div class="cc-label">Purchaser</div><div class="cc-value" id="ccPurchaser"></div></div>
      <div><div class="cc-label">Occupancy Target</div><div class="cc-value" id="ccOccupancy"></div></div>
      <div><div class="cc-label">Supplier</div><div class="cc-value" id="ccSupplier"></div></div>
    </div>
    <div class="project-desc" id="projDesc"></div>
    <div class="winter-note" id="winterNote" style="display:none;"></div>
  </div>

  <div class="metrics">
    <div class="metric-card">
      <div class="metric-label">Overall Progress</div>
      <div class="metric-value" id="overallProgress">—</div>
    </div>
  </div>

  <div id="siteCards" class="site-cards-grid" style="margin-bottom:14px;"></div>

  <div id="siteSections"></div>

  <div class="card" style="margin-bottom:14px;">
    <h2>Gallery</h2>
    <div id="galleryGrid" class="gallery-grid"></div>
    <input type="file" id="photoFileInput" accept="image/*" style="display:none;">
  </div>

  <div class="card">
    <h2>Recent Activity</h2>
    <div id="activityList"></div>
    <div class="activity-pager" id="activityPager" style="display:none;">
      <button class="btn" id="btnActivityPrev">Previous</button>
      <span id="activityPageLabel"></span>
      <button class="btn" id="btnActivityNext">Next</button>
    </div>
  </div>

  <footer class="appfooter">
    <span>McGivney Community Homes — Project Schedule · <span id="syncStatus">Connecting…</span></span>
    <span id="lastUpdated"></span>
  </footer>
</div>

<!-- Task add/edit modal -->
<div class="modal-overlay" id="taskModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="taskModalTitle">Add Task</h3>
      <button class="icon-btn" id="btnCloseTaskModal" style="font-size:22px;">×</button>
    </div>
    <div class="modal-body">
      <div class="field"><label>Task Name *</label><input type="text" id="tkTask"></div>
      <div class="field-row">
        <div class="field"><label>Start Date</label><input type="date" id="tkStart"></div>
        <div class="field"><label>End Date</label><input type="date" id="tkEnd"></div>
      </div>
      <div class="field"><label>Status</label>
        <select id="tkStatus">
          <option value="low">Low Priority</option>
          <option value="med">Medium Priority</option>
          <option value="high">High Priority</option>
          <option value="inprog">In Progress</option>
          <option value="complete">Complete</option>
        </select>
      </div>
      <div class="field"><label>Notes</label><textarea id="tkNotes"></textarea></div>
      <div class="modal-error" id="tkError"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnCancelTaskModal">Cancel</button>
      <button class="btn primary" id="btnSaveTaskModal">Save Task</button>
    </div>
  </div>
</div>

<!-- Site info edit modal -->
<div class="modal-overlay" id="siteModalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="siteModalTitle">Edit Site</h3>
      <button class="icon-btn" id="btnCloseSiteModal" style="font-size:22px;">×</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>Site Name</label><input type="text" id="siName"></div>
        <div class="field"><label>Address</label><input type="text" id="siAddr"></div>
      </div>
      <div class="field"><label>Type</label><input type="text" id="siType"></div>
      <div class="field-row">
        <div class="field"><label>Target Completion</label><input type="text" id="siTarget" placeholder="e.g. Dec 15, 2026"></div>
        <div class="field"><label>Status Badge</label><input type="text" id="siBadge" placeholder="e.g. Framing Underway"></div>
      </div>
      <div class="field"><label class="checkbox-row"><input type="checkbox" id="siWinterRisk"> Crosses winter shutdown</label></div>
      <div class="field"><label>Note</label><textarea id="siNote" style="min-height:100px;"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnCancelSiteModal">Cancel</button>
      <button class="btn primary" id="btnSaveSiteModal">Save Site Info</button>
    </div>
  </div>
</div>

<!-- Photo lightbox -->
<div class="lightbox-overlay" id="lightboxOverlay">
  <button class="lightbox-close" id="btnCloseLightbox">×</button>
  <div>
    <img id="lightboxImg" src="" alt="">
    <div class="lightbox-cap" id="lightboxCap"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
